events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # CloudFront talks directly to this Port 80 block now!
    server {
        listen 80 default_server;
        server_name denvergram.me www.denvergram.me _;

        # Path to your React compiled production build assets
        root /usr/share/nginx/html;
        index index.html;

        # Frontend SPA Routing Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Standard API proxying to Go
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Legacy Form endpoints
        location /form/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
        }

        # Real-time WebSocket connection upgrades
        location /api/ws {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}