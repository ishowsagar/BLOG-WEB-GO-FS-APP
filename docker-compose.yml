services:
  postgres_instagram_db:
    image: postgres:15-alpine
    container_name: instagram_db_container
    env_file:
      - ./Backend/.env
    environment:
      - POSTGRES_DB=instagramdb
      - POSTGRES_USER=blog_admin
      - POSTGRES_PASSWORD=blog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fs-go-app-network
    restart: unless-stopped

  redis_cache_micro_service:
    image: redis:7-alpine
    container_name: instagram_redis_cache_container
    env_file:
      - ./Backend/.env
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - fs-go-app-network
    restart: unless-stopped

  rabbit_mq_notifications_micro_service:
    image: rabbitmq:3-management
    container_name: instagram_rabbitmq_container
    env_file:
      - ./Backend/.env
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks:
      - fs-go-app-network
    restart: unless-stopped

  # Loki for metrics/logs
  loki:
    image: grafana/loki:3.0.0
    container_name: loki_service_container
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - default

  # logging shipper
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail_service_container
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    environment :   
      PROMTAIL_CONFIG: |
        server:
          http_listen_port: 9080
          grpc_listen_port: 0
        positions:
          filename: /tmp/positions.yaml
        clients:
          - url: http://loki:3100/loki/api/v1/push
        scrape_configs:
          - job_name: docker-logs
            docker_sd_configs:
              - host: unix:///var/run/docker.sock
                refresh_interval: 5s
            relabel_configs:
              - source_labels: [__meta_docker_container_name]
                regex: /.*(go_backend_server_container).*
                target_label: container
    command: -config.expand-env=true -config.string=$${PROMTAIL_CONFIG}
    depends_on:
      - loki

  # grafana for visual dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_ui_container
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=somesecretpass
    depends_on:
      - loki
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: go_backend_server_container
    env_file:
      - ./Backend/.env
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres_instagram_db
      - SERVER_PORT=8080
      - REDIS_HOST_ADDR=redis_cache_micro_service:6379
    depends_on:
      - postgres_instagram_db
      - rabbit_mq_notifications_micro_service
      - redis_cache_micro_service
    command: >
      sh -c "
      echo 'Waiting for postgres...' && while ! nc -z instagram_db_container 5432; do sleep 1; done;
      echo 'Waiting for redis...' && while ! nc -z instagram_redis_cache_container 6379; do sleep 1; done;
      echo 'Waiting for rabbitmq...' && while ! nc -z instagram_rabbitmq_container 5672; do sleep 1; done;
      echo 'All infrastructure assets are online! Starting Go application layer...' &&
      ./main
      "
    networks:
      - fs-go-app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/instagram-clone-site
      dockerfile: dockerfile
    container_name: react_frontend_container
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - fs-go-app-network
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitdata:

networks:
  fs-go-app-network:
    driver: bridge
