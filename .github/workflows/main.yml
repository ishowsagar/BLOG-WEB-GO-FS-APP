name: Go continuous Integration and Deployment

# when detects a push change on [ this target] branch
on:
  push:
    branches:
      - main

jobs:
  test-suite:
    # what it do - and where it runs on
    name: Run Aggressive Unit Tests
    runs-on: ubuntu-latest

    # ! defining what job would do actually - defining "steps" after defining the job's description
    steps:
      ## 1. spin up machine for repo
      # checkout - workers for specfic tasks
      - name: Checkout Source Code
        uses: actions/checkout@v4

      ## 2. setup go environment
      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      ## 3. provionsing a cached env so rest pushes uses that in superfast speed
      - name: Restore/Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      ## 4. installed required dependicies
      - name: Install Dependencies
        working-directory: ./Backend
        run: go mod download

      ## 5. run tests
      - name: Execute Unit Tests
        working-directory: ./Backend
        run: go test -v ./testor/...

  deploy:
    name: Deplpoy to Ec2 Instance
    runs-on: ubuntu-latest
    needs: test-suite #! important - for this job to be executed - first it needs "test-suite" job's steps workers (checkout) work to be done before this

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Execute shh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/BLOG-WEB-GO-FS-APP
            git pull origin main
            docker compose up -d --build
